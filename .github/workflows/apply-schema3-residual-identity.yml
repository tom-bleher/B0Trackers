name: Apply schema3 residual identity support

on:
  push:
    branches: [feat/phase-space-provenance]
    paths:
      - tools/use_schema3_stable_residual_identity.py
      - .github/workflows/apply-schema3-residual-identity.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase-space-provenance
          fetch-depth: 0
      - run: python3 tools/use_schema3_stable_residual_identity.py
      - run: git rm tools/use_schema3_stable_residual_identity.py .github/workflows/apply-schema3-residual-identity.yml
      - name: Commit stable residual identity support
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(report): use schema3 stable identity for selected-track residuals"
          git push origin HEAD:feat/phase-space-provenance
