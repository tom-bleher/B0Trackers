name: Apply phase-space report transformation

on:
  push:
    branches: [feat/phase-space-provenance]
    paths:
      - tools/apply_phase_space_report.py
      - .github/workflows/apply-phase-space.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase-space-provenance
          fetch-depth: 0
      - run: python3 tools/apply_phase_space_report.py
      - run: git rm tools/apply_phase_space_report.py .github/workflows/apply-phase-space.yml
      - name: Commit generated diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(analysis): add phase-space and provenance diagnostics"
          git push origin HEAD:feat/phase-space-provenance
