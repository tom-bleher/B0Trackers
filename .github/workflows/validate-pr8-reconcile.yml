name: Validate reconciled PR8

on:
  push:
    branches:
      - feat/phase-space-provenance
    paths:
      - '.github/workflows/validate-pr8-reconcile.yml'

permissions:
  contents: read

jobs:
  dependency-light:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install analysis dependencies
        run: python -m pip install --disable-pip-version-check numpy awkward uproot
      - name: Configure, build, and test
        run: |
          cmake -S . -B build -DB0Trackers_BUILD_PLUGIN=OFF -DBUILD_TESTING=ON
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
