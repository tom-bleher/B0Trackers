name: Reconcile PR8 with schema3 main

on:
  push:
    branches:
      - feat/phase-space-provenance
    paths:
      - '.github/workflows/reconcile-pr8-main.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase-space-provenance
          fetch-depth: 0
      - name: Merge main and reconcile the report layer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-commit --no-ff origin/main || true

          conflicts="$(git diff --name-only --diff-filter=U)"
          if [ "$conflicts" != "analysis/b0_report.py" ]; then
            echo "Unexpected conflict set:"
            printf '%s\n' "$conflicts"
            exit 1
          fi

          # Start from PR8's richer report, then copy the schema3-specific pieces
          # that landed on main after this branch diverged.
          git checkout --ours -- analysis/b0_report.py
          git add analysis/b0_report.py

          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          path = Path('analysis/b0_report.py')
          current = path.read_text()
          main = subprocess.check_output(
              ['git', 'show', 'origin/main:analysis/b0_report.py'], text=True
          )

          def replace_section(text, source, start, end):
              s0 = source.index(start)
              s1 = source.index(end, s0)
              t0 = text.index(start)
              t1 = text.index(end, t0)
              return text[:t0] + source[s0:s1] + text[t1:]

          # Use main's RNTuple-safe scalar reader verbatim.
          current = replace_section(
              current, main,
              'def _scalar(tree, name, np):\n',
              'def _jagged(tree, name, ak):\n',
          )

          # Use main's schema/availability preamble so schema3 requires the
          # unfiltered track-association product rather than silently degrading.
          current = replace_section(
              current, main,
              '        schema = _scalar(tree, "schema_version", np)\n',
              '        stations = _scalar(tree, "n_stations_primary", np)\n',
          )

          # Use main's state/residual block, which includes stable parent ObjectID
          # selection plus predicted-innovation diagnostics. PR8's phase-space,
          # full-funnel and provenance additions live outside this block.
          current = replace_section(
              current, main,
              '        residuals: dict[str, dict] = {}\n',
              '        association_quality = {}\n',
          )

          if '"predicted_innovation": innovation,' not in current:
              needle = '            "measurement_residuals_by_station": residuals,\n'
              if needle not in current:
                  raise SystemExit('report dictionary insertion point missing')
              current = current.replace(
                  needle,
                  needle + '            "predicted_innovation": innovation,\n',
                  1,
              )

          required = [
              'selected_primary_full_funnel',
              'efficiency_vs_truth_phi_rad',
              'association_defined_fake_fraction',
              'selected_primary_station_side_patterns',
              'predicted_innovation',
              'has_ckf_assocs_unfiltered',
              'library="ak"',
          ]
          missing = [token for token in required if token not in current]
          if missing:
              raise SystemExit(f'merged report lost required features: {missing}')

          path.write_text(current)
          PY

          rm -f .github/workflows/probe-pr8-main.yml
          rm -f .github/workflows/reconcile-pr8-main.yml
          git add -A
          git commit -m "Merge schema3 main into phase-space reporting"
          git push origin HEAD:feat/phase-space-provenance
