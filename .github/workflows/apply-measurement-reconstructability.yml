name: Apply measurement reconstructability diagnostics

on:
  push:
    branches: [feat/schema3-track-diagnostics]
    paths:
      - tools/add_measurement_reconstructability.py
      - .github/workflows/apply-measurement-reconstructability.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/schema3-track-diagnostics
          fetch-depth: 0
      - run: python3 tools/add_measurement_reconstructability.py
      - run: git rm tools/add_measurement_reconstructability.py .github/workflows/apply-measurement-reconstructability.yml
      - name: Commit reconstructability diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(schema3): add measurement-level reconstructability"
          git push origin HEAD:feat/schema3-track-diagnostics
