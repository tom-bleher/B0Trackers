name: Apply schema 3 source transformation

on:
  push:
    branches: [feat/schema3-track-diagnostics]
    paths:
      - tools/apply_schema3.py
      - .github/workflows/apply-schema3.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/schema3-track-diagnostics
          fetch-depth: 0

      - name: Apply schema 3 transformation
        run: python3 tools/apply_schema3.py

      - name: Remove one-shot transformation tooling
        run: git rm tools/apply_schema3.py .github/workflows/apply-schema3.yml

      - name: Commit generated source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(schema3): add interpretable track-state diagnostics"
          git push origin HEAD:feat/schema3-track-diagnostics
