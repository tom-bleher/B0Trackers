name: Apply schema3 seed ObjectID fix

on:
  push:
    branches: [feat/schema3-track-diagnostics]
    paths:
      - tools/add_stable_seed_object_ids.py
      - .github/workflows/apply-schema3-seed-objectid.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/schema3-track-diagnostics
          fetch-depth: 0
      - run: python3 tools/add_stable_seed_object_ids.py
      - run: git rm tools/add_stable_seed_object_ids.py .github/workflows/apply-schema3-seed-objectid.yml
      - name: Commit stable seed identity fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(schema3): map ACTS seed positions to PODIO ObjectIDs"
          git push origin HEAD:feat/schema3-track-diagnostics
