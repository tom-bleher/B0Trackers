name: Apply schema 3 report update

on:
  push:
    branches: [feat/schema3-track-diagnostics]
    paths:
      - tools/apply_schema3_report.py
      - .github/workflows/apply-schema3-report.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/schema3-track-diagnostics
          fetch-depth: 0
      - run: python3 tools/apply_schema3_report.py
      - run: git rm tools/apply_schema3_report.py .github/workflows/apply-schema3-report.yml
      - name: Commit generated report changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(schema3): consume stable identity and innovations in reports"
          git push origin HEAD:feat/schema3-track-diagnostics
