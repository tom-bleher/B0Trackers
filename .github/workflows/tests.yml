name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dependency-light:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure helper-only build
        run: cmake -S . -B build -DB0Trackers_BUILD_PLUGIN=OFF -DBUILD_TESTING=ON

      - name: Build helper tests
        run: cmake --build build --parallel 2

      - name: Run C++ and Python regression tests
        run: ctest --test-dir build --output-on-failure
