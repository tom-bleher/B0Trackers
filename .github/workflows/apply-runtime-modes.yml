name: Apply runtime modes transformation

on:
  push:
    branches: [perf/selective-analysis]
    paths:
      - tools/apply_runtime_modes.py
      - .github/workflows/apply-runtime-modes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/selective-analysis
          fetch-depth: 0
      - run: python3 tools/apply_runtime_modes.py
      - run: git rm tools/apply_runtime_modes.py .github/workflows/apply-runtime-modes.yml
      - name: Commit generated runtime changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "perf: avoid requesting disabled B0 analysis products"
          git push origin HEAD:perf/selective-analysis
